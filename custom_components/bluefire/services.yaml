  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: bluefire
    mid: *controller_mid
read_diagnostic_codes:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: bluefire
    mid: *controller_mid
read_software_identification:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: bluefire
    mid: *controller_mid
read_vehicle_identification:
  fields:
    entry_id:
