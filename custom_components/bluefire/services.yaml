cleanup_mqtt:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: bluefire
    dry_run:
      required: false
      default: true
      selector:
        boolean:
read_odometer:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: bluefire
    mid: &controller_mid
      required: false
      selector:
        number:
          min: 0
          max: 255
          step: 1
          mode: box
