rules:
  action-setup:
    status: done
    comment: Inspection, notification capture and explicit on-demand J1708 fuel/fault read actions are registered in custom_components/bluefire/__init__.py and described in custom_components/bluefire/services.yaml.
  appropriate-polling:
    status: done
    comment: Opt-in J1708 startup enables sequential one-minute fuel/fault polling in custom_components/bluefire/receiver.py with per-PID backoff capped at 15 minutes, busy-read exclusion and session-bound cancellation. Polled sensors expire at 180 seconds; other sensors retain 60-second expiry. Diagnostic sensors read in-memory counters every 15 seconds.
  brands:
    status: done
    comment: The integration provides a local HACS brand icon at custom_components/bluefire/brand/icon.png.
  common-modules:
    status: done
    comment: Frame parsing and the MQTT bridge are centralized in custom_components/bluefire/telemetry.py.
  config-flow-test-coverage:
    status: done
    comment: tests/test_config_flow.py covers every config flow line, and CI enforces 100 percent coverage for custom_components/bluefire/config_flow.py.
  config-flow:
    status: done
    comment: UI setup and reconfiguration forms are implemented in custom_components/bluefire/config_flow.py and translated in custom_components/bluefire/strings.json.
  dependency-transparency:
    status: done
    comment: Runtime dependencies and Home Assistant integrations are declared in custom_components/bluefire/manifest.json.
  docs-actions:
    status: done
    comment: Adapter inspection, notification capture and on-demand fuel/fault read actions and their limits are documented in README.md.
  docs-triggers:
    status: exempt
    comment: BlueFire provides no integration-specific triggers to document.
  docs-conditions:
    status: exempt
    comment: BlueFire provides no integration-specific conditions to document.
  docs-high-level-description:
    status: done
    comment: Integration purpose, status, and boundaries are described in README.md.
  docs-installation-instructions:
    status: done
    comment: Manual installation and initial setup instructions are provided in README.md.
  docs-removal-instructions:
    status: done
    comment: Retained MQTT discovery cleanup on permanent entry removal is documented in README.md.
  entity-event-setup:
    status: done
    comment: Health sensors register their update listener in async_added_to_hass with async_on_remove in custom_components/bluefire/sensor.py.
  entity-unique-id:
    status: done
    comment: The diagnostic entity and MQTT discoveries use stable unique identifiers in custom_components/bluefire/sensor.py and custom_components/bluefire/telemetry.py.
  has-entity-name:
    status: done
    comment: The protocol diagnostic entity uses Home Assistant entity naming in custom_components/bluefire/sensor.py.
  runtime-data:
    status: done
    comment: Per-entry runtime state is stored on the config entry in custom_components/bluefire/__init__.py.
  test-before-configure:
    status: todo
    comment: Setup is intentionally offline-ready and does not verify a BlueFire adapter or protocol before creating an entry.
  test-before-setup:
    status: todo
    comment: The provisional EZ receiver starts on entry setup; adapter hardware validation remains outstanding.
  unique-config-entry:
    status: done
    comment: Duplicate adapter addresses and MQTT vehicle identifiers are rejected in custom_components/bluefire/config_flow.py.
  action-exceptions:
    status: done
    comment: Inspection failures and invalid config entries raise Home Assistant validation errors in custom_components/bluefire/__init__.py.
  config-entry-unloading:
    status: done
    comment: Entry unload and retained-state cleanup are implemented in custom_components/bluefire/__init__.py and covered by tests/test_boundaries.py.
  docs-configuration-parameters:
    status: done
    comment: Adapter identity, vehicle identifier constraints, and MQTT configuration are documented in README.md.
  docs-installation-parameters:
    status: done
    comment: README.md documents manual installation and states the Home Assistant and MQTT prerequisites.
  entity-unavailable:
    status: done
    comment: MQTT-discovered telemetry has per-protocol retained availability and freshness expiry; the receiver withdraws availability on connection loss in custom_components/bluefire/receiver.py and custom_components/bluefire/telemetry.py.
  integration-owner:
    status: done
    comment: An active owner is declared in custom_components/bluefire/manifest.json.
  log-when-unavailable:
    status: done
    comment: Receiver connection failures are logged with bounded exponential reconnect backoff, and successful subscriptions log recovery in custom_components/bluefire/receiver.py.
  parallel-updates:
    status: done
    comment: The sensor platform sets PARALLEL_UPDATES to 0 for in-memory diagnostic updates in custom_components/bluefire/sensor.py.
  reauthentication-flow:
    status: exempt
    comment: J1708 startup supports only unsecured adapters; it stores no credentials and rejects security failures rather than changing adapter security. See custom_components/bluefire/startup.py.
  test-coverage:
    status: done
    comment: CI measures all integration modules and enforces at least 96 percent coverage using requirements-dev.txt and .github/workflows/validate.yml.
  devices:
    status: done
    comment: The diagnostic sensor is associated with a config-entry device in custom_components/bluefire/sensor.py.
  diagnostics:
    status: done
    comment: User-requested, unredacted config-entry diagnostics with a bounded raw BLE notification capture are provided in custom_components/bluefire/diagnostics.py and tested in tests/test_boundaries.py.
  discovery-update-info:
    status: todo
    comment: The integration does not currently track or update adapter network identity information.
  discovery:
    status: todo
    comment: Nearby adapters can be selected manually, but automatic compatible-device discovery is not implemented.
  docs-data-update:
    status: done
    comment: The MQTT topics, freshness, availability, and update semantics are documented in README.md.
  docs-examples:
    status: todo
    comment: The README has a synthetic payload example but no end-user automation examples yet.
  docs-known-limitations:
    status: done
    comment: README.md documents opt-in unsecured J1708 startup, passive monitoring, secured-adapter limitations and outstanding hardware verification.
  docs-supported-devices:
    status: done
    comment: README.md explains the BlueFire adapter scope and that hardware compatibility is not yet verified.
  docs-supported-functions:
    status: done
    comment: Implemented setup, opt-in J1708 startup, BLE reception, diagnostics, MQTT behavior and protocol limitations are described in README.md.
  docs-troubleshooting:
    status: done
    comment: README.md includes guidance for missing BLE devices, MQTT setup, adapter inspection, and offline behavior.
  docs-use-cases:
    status: todo
    comment: Dedicated end-user use cases are not yet documented.
  dynamic-devices:
    status: todo
    comment: Dynamic Home Assistant device addition after initial setup is not implemented.
  entity-category:
    status: done
    comment: The protocol status and receive-health entities are categorized as diagnostic in custom_components/bluefire/sensor.py.
  entity-device-class:
    status: done
    comment: The protocol status entity and prepared telemetry use appropriate device classes in custom_components/bluefire/sensor.py and custom_components/bluefire/telemetry.py.
  entity-disabled-by-default:
    status: done
    comment: Byte and MQTT-publish tally sensors are disabled by default in custom_components/bluefire/sensor.py.
  entity-translations:
    status: todo
    comment: Config and service strings are translated, but the diagnostic entities have no translation keys.
  exception-translations:
    status: todo
    comment: Service validation errors currently use inline English text rather than translated exception strings.
  icon-translations:
    status: todo
    comment: No BlueFire-owned entity icon translations are currently defined.
  reconfiguration-flow:
    status: done
    comment: Adapter MAC and name can be corrected while preserving vehicle identity in custom_components/bluefire/config_flow.py.
  repair-issues:
    status: todo
    comment: No repair issue is currently raised for the missing BlueFire protocol or other user-actionable conditions.
  stale-devices:
    status: todo
    comment: Stale device registry cleanup is not implemented or tested.
  async-dependency:
    status: done
    comment: BLE inspection uses Home Assistant's asynchronous connection helpers in custom_components/bluefire/bluetooth.py.
  inject-websession:
    status: exempt
    comment: The integration makes no HTTP requests and has no HTTP dependency.
  strict-typing:
    status: todo
    comment: Strict static type checking is not configured or enforced for the integration.
